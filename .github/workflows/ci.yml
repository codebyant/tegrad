name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  install-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint installer with shellcheck
        run: shellcheck install/install.sh
      - name: Verify systemd units
        run: |
          set -eu
          sudo groupadd --system tegrad-srv
          sudo useradd --system --gid tegrad-srv --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin tegrad-srv
          sudo groupadd --system tegrad
          sudo useradd --system --gid tegrad --home-dir /var/lib/tegrad --no-create-home --shell /usr/sbin/nologin tegrad
          sudo usermod -aG tegrad-srv tegrad
          sudo install -d -o root -g root -m 0755 /opt/tegrad/bin
          sudo install -d -o tegrad -g tegrad -m 0700 /var/lib/tegrad /var/lib/tegrad/update
          sudo install -d -o tegrad-srv -g tegrad-srv -m 2770 /var/lib/tegrad-servers /var/lib/tegrad-servers/test
          sudo install -d -o root -g tegrad -m 0750 /run/tegrad-server
          printf '#!/bin/sh\nexit 0\n' | sudo tee /opt/tegrad/bin/tegrad /var/lib/tegrad-servers/test/start.sh >/dev/null
          sudo chmod 0755 /opt/tegrad/bin/tegrad /var/lib/tegrad-servers/test/start.sh
          tmp_dir=$(mktemp -d)
          for unit in tegrad.service tegrad-update.service tegrad-update.path tegrad-server@.service tegrad-server@.socket; do
            sed \
              -e 's|@TEGRAD_BIN_DIR@|/opt/tegrad/bin|g' \
              -e 's|@TEGRAD_BIN@|/opt/tegrad/bin/tegrad|g' \
              -e 's|@TEGRAD_STATE_DIR@|/var/lib/tegrad|g' \
              -e 's|@TEGRAD_SERVERS_DIR@|/var/lib/tegrad-servers|g' \
              -e 's|@TEGRAD_RUN_DIR@|/run/tegrad-server|g' \
              "install/units/${unit}" > "${tmp_dir}/${unit}"
          done
          sudo systemd-analyze verify "${tmp_dir}/tegrad.service" "${tmp_dir}/tegrad-update.service" "${tmp_dir}/tegrad-update.path" "${tmp_dir}/tegrad-server@test.service" "${tmp_dir}/tegrad-server@test.socket"
